<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maxwell - Aircraft</title>
    <style>
        body {
            margin: 0;
            background-color: #00276b; /* Lo sfondo blu del sito */
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .aereo-container {
            position: relative;
            width: 900px; /* Dimensione fissa per gestire meglio i finestrini */
            animation: entraVolo 4s ease-out forwards;
        }

        @keyframes entraVolo {
            0% { transform: translateX(-110%); }
            100% { transform: translateX(0%); }
        }

        .aereo-img {
            width: 100%;
            display: block;
            /* Specchia l'aereo e usa screen per eliminare lo sfondo nero */
            transform: scaleX(-1); 
            mix-blend-mode: screen; 
            filter: brightness(1.2) contrast(1.1);
        }

        /* Il wrapper dei finestrini deve muoversi insieme all'aereo */
        .windows-wrapper {
            position: absolute;
            top: 45%; 
            left: 28%; 
            display: flex;
            gap: 8px;
            z-index: 10;
        }

        .window-frame {
            position: relative;
            width: 38px;
            height: 55px; /* Ridotto per adattarsi meglio alla sagoma */
            background-color: #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid #555;
            transition: transform 0.2s;
        }

        .window-frame:hover { 
            transform: scale(1.4); 
            z-index: 20; 
            border-color: white;
        }

        .sky-view {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }

        .sky-view img { width: 100%; height: 100%; object-fit: cover; }

        .shutter {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(to bottom, #ddd, #999);
            z-index: 5;
            transition: transform 0.5s ease-in-out;
        }

        .window-frame.is-open .shutter { transform: translateY(-100%); }

        @media (max-width: 1024px) {
            .aereo-container {
                width: min(900px, 94vw);
            }

            .windows-wrapper {
                gap: 6px;
            }
        }

        @media (max-width: 700px) {
            body {
                padding: 10px;
                overflow: auto;
            }

            .aereo-container {
                width: min(900px, 98vw);
            }

            .windows-wrapper {
                left: 24%;
                top: 43%;
                gap: 4px;
            }

            .window-frame {
                width: 28px;
                height: 40px;
                border-width: 1px;
            }
        }
    </style>
</head>
<body>

    <div class="aereo-container">
        <img src="aereo-ritagliato.png" class="aereo-img">

        <div class="windows-wrapper">
            <div class="window-frame" onclick="this.classList.toggle('is-open')">
                <div class="sky-view"><img src="https://picsum.photos/100/150?random=1" onclick="location.href='fonti.html'"></div>
                <div class="shutter"></div>
            </div>
            <div class="window-frame" onclick="this.classList.toggle('is-open')">
                <div class="sky-view"><img src="https://picsum.photos/100/150?random=2" onclick="location.href='chisiamo.html'"></div>
                <div class="shutter"></div>
            </div>
            <div class="window-frame" onclick="this.classList.toggle('is-open')">
                <div class="sky-view"><img src="https://picsum.photos/100/150?random=3" onclick="location.href='olla.html'"></div>
                <div class="shutter"></div>
            </div>
            <div class="window-frame" onclick="this.classList.toggle('is-open')">
                <div class="sky-view"><img src="https://picsum.photos/100/150?random=4" onclick="location.href='calo.html'"></div>
                <div class="shutter"></div>
            </div>
            <div class="window-frame" onclick="this.classList.toggle('is-open')">
                <div class="sky-view"><img src="https://picsum.photos/100/150?random=5" onclick="location.href='maffucci.html'"></div>
                <div class="shutter"></div>
            </div>
            <div class="window-frame" onclick="this.classList.toggle('is-open')">
                <div class="sky-view"><img src="https://picsum.photos/100/150?random=6" onclick="location.href='olla2.html'"></div>
                <div class="shutter"></div>
            </div>
        </div>
    </div>

</body>
</html>
