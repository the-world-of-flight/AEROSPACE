<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maxwell - The World of Flight</title>
    <link rel="stylesheet" href="home.css">
</head>
<body>

    <div class="sky-view">
        <div class="cloud" style="top: 20%; width: 100px; height: 30px; animation-duration: 10s;"></div>
        <div class="cloud" style="top: 60%; width: 150px; height: 40px; animation-duration: 20s;"></div>
    </div>

    <div class="falling-scene" aria-hidden="true">
        <div class="falling-clouds"></div>
        <img src="C130H.png" class="c130-pass" id="c130Pass" alt="C-130 in volo">
        <div class="drop-zone" id="dropZone"></div>
    </div>

    <div class="hamburger" id="hamburger">
        <span></span><span></span><span></span>
    </div>

    <header>
        <div class="logo-container">
            <img src="Gemini_Generated_Image_ho830uho830uho83.png" class="header-logo" alt="Logo">
        </div>

        <h1>MAXWELL IL MONDO DEL VOLO</h1>

        <div class="search-wrapper">
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Cerca un eroe, una data o un concetto...">
                <div id="resultsList"></div>
            </div>
        </div>
    </header>

    <div class="menu-screen" id="menuScreen">
        <div class="menu-columns">
            <div class="menu-col">
                <h3>Informazioni</h3>
                <a href="index.html">Home</a>
                <a href="chisiamo.html">Chi siamo</a>
            </div>

            <div class="menu-col">
                <h3>Sezioni</h3>
                <a href="olla.html">Interdisciplinarietà dell'aerospazio</a>
                <a href="olla2.html">Eroi nello spazio</a>
                <a href="calo.html">Dalla leggenda al progresso</a>
                <a href="maffucci.html">Post-eroismo</a>
                <a href="sesta-generazione.html">Sesta generazione</a>
            </div>

            <div class="menu-col">
                <h3>Account</h3>
                <button class="menu-logout" onclick="logout()">Logout</button>
            </div>
        </div>
    </div>

    <script src="home.js"></script>

</body>
</html>
